name: R45 智慧首頁回歸測試

on:
  push:
    paths:
      - 'index.html'
      - 'js/**'
      - 'tests/r45-smoke.cjs'
      - '.github/workflows/test-r45.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check home and financial guardrails
        run: node tests/r45-smoke.cjs
