name: R48 全站回歸測試

on:
  push:
    paths:
      - 'index.html'
      - 'js/**'
      - 'tests/**'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'icons/**'
      - '.github/workflows/test-r45.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check home and financial guardrails
        run: |
          node tests/r45-smoke.cjs
          node tests/r46-smoke.cjs
          node tests/r47-smoke.cjs
          node tests/r48-smoke.cjs
