<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的存股追蹤</title>
  <style>
    :root {
      --bg: #061323;
      --card: #0d1d32;
      --card-alt: linear-gradient(135deg, #0e2a4b, #0b1b31);
      --line: #203b5f;
      --text: #f2f6ff;
      --muted: #91a5be;
      --red: #fb7185; /* 台股漲/賺錢 顏色 */
      --green: #34d399; /* 台股跌/賠錢 顏色 */
      --blue: #6ea8fe;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding-bottom: 80px;
    }
    /* 頂部導覽列 */
    .header {
      position: sticky; top: 0; z-index: 10;
      padding: 16px 20px; background: rgba(8, 17, 30, 0.9);
      backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center;
    }
    .header h1 { margin: 0; font-size: 22px; font-weight: 800; }
    
    /* 總覽卡片 */
    .summary-card {
      margin: 16px; padding: 20px; border-radius: 20px;
      background: var(--card-alt); border: 1px solid var(--line);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    .summary-card .label { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .summary-card .total-asset { font-size: 36px; font-weight: 900; margin: 0; }
    .summary-card .pnl-row { display: flex; gap: 16px; margin-top: 12px; font-size: 16px; font-weight: bold; }
    
    /* 股票列表 */
    .section-title { margin: 24px 16px 12px; font-size: 18px; font-weight: bold; }
    .stock-list { display: grid; gap: 12px; padding: 0 16px; }
    .stock-card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 16px;
      display: grid; grid-template-columns: 1fr auto; gap: 12px;
    }
    .stock-info h3 { margin: 0 0 4px; font-size: 18px; }
    .stock-info .code { font-size: 12px; color: var(--muted); background: #122b48; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
    .stock-meta { font-size: 13px; color: var(--muted); margin-top: 8px; }
    .stock-price-col { text-align: right; }
    .stock-price-col .current-price { font-size: 20px; font-weight: bold; }
    .stock-price-col .pnl { font-size: 14px; margin-top: 4px; font-weight: bold; }
    
    /* 顏色變化 */
    .up { color: var(--red); }
    .down { color: var(--green); }
    .flat { color: var(--text); }

    /* 浮動按鈕 */
    .fab {
      position: fixed; bottom: 24px; right: 24px; z-index: 20;
      width: 56px; height: 56px; border-radius: 28px;
      background: linear-gradient(135deg, #4f8cff, #7357ff);
      color: white; border: none; font-size: 28px; font-weight: bold;
      box-shadow: 0 8px 24px rgba(79, 140, 255, 0.4); cursor: pointer;
    }

    /* 簡單的新增表單彈窗 */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      z-index: 50; align-items: flex-end; justify-content: center;
    }
    .modal.show { display: flex; }
    .modal-content {
      background: #0b192a; width: 100%; border-radius: 24px 24px 0 0;
      padding: 24px; border-top: 1px solid var(--line);
    }
    .modal-content input {
      width: 100%; background: #081728; border: 1px solid var(--line);
      color: white; padding: 12px; border-radius: 12px; margin-bottom: 16px; font-size: 16px;
    }
    .btn-row { display: flex; gap: 12px; }
    .btn {
      flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; cursor: pointer;
    }
    .btn-cancel { background: #132844; color: white; }
    .btn-save { background: linear-gradient(135deg, #4f8cff, #7357ff); color: white; }
  </style>
</head>
<body>

  <div class="header">
    <h1>我的投資組合</h1>
    <span id="update-time" style="font-size: 12px; color: var(--muted);">更新中...</span>
  </div>

  <div class="summary-card">
    <div class="label">預估總資產 (TWD)</div>
    <div class="total-asset" id="total-asset">--</div>
    <div class="pnl-row">
      <div id="total-pnl-amt">未實現損益: --</div>
      <div id="total-pnl-pct">--%</div>
    </div>
  </div>

  <div class="section-title">持股明細</div>
  <div class="stock-list" id="stock-list">
    <!-- 股票卡片會由 JavaScript 動態產生 -->
    <div style="text-align: center; color: #91a5be; padding: 20px;">載入即時報價中...</div>
  </div>

  <!-- 新增股票按鈕 -->
  <button class="fab" onclick="document.getElementById('add-modal').classList.add('show')">+</button>

  <!-- 新增股票彈窗 -->
  <div class="modal" id="add-modal">
    <div class="modal-content">
      <h3 style="margin-top: 0;">新增持股紀錄</h3>
      <input type="text" id="input-code" placeholder="股票代號 (如: 2330)">
      <input type="number" id="input-shares" placeholder="持有股數 (如: 1000)">
      <input type="number" id="input-cost" placeholder="買入均價 (如: 800.5)">
      <div class="btn-row">
        <button class="btn btn-cancel" onclick="document.getElementById('add-modal').classList.remove('show')">取消</button>
        <button class="btn btn-save" onclick="addStock()">儲存</button>
      </div>
    </div>
  </div>

  <script>
    // 1. 預設的測試資料 (假裝我們已經買了這些股票)
    // 之後這段資料會改由 Firebase 雲端讀取
    let myPortfolio = [
      { code: '0050', shares: 2500, avgCost: 150.5 },
      { code: '2330', shares: 500, avgCost: 810.0 },
      { code: '00878', shares: 5000, avgCost: 20.2 }
    ];

    let marketData = {}; // 存放從證交所抓下來的最新報價

    // 格式化金錢顯示
    function formatMoney(num) {
      return Math.round(num).toLocaleString('zh-TW');
    }

    // 取得顏色 Class (台灣習慣：紅漲綠跌)
    function getColorClass(val) {
      if (val > 0) return 'up';
      if (val < 0) return 'down';
      return 'flat';
    }

    // 2. 從證交所 OpenAPI 抓取所有股票收盤行情
    async function fetchMarketData() {
      try {
        const res = await fetch('https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL');
        const data = await res.json();
        
        // 整理成 { "2330": { price: 900, name: "台積電" }, ... } 的格式方便查詢
        data.forEach(stock => {
          marketData[stock.Code] = {
            name: stock.Name,
            price: parseFloat(stock.ClosingPrice) || 0
          };
        });

        const now = new Date();
        document.getElementById('update-time').innerText = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')} 更新`;
        
        renderUI(); // 資料抓完後，重新繪製畫面
      } catch (error) {
        console.error('抓取報價失敗:', error);
        document.getElementById('update-time').innerText = '報價更新失敗';
      }
    }

    // 3. 計算損益並繪製介面
    function renderUI() {
      let totalAsset = 0;
      let totalCost = 0;
      let html = '';

      myPortfolio.forEach(item => {
        const stock = marketData[item.code] || { name: '未知', price: item.avgCost };
        const currentPrice = stock.price;
        const marketValue = currentPrice * item.shares;
        const costValue = item.avgCost * item.shares;
        
        const pnlAmt = marketValue - costValue;
        const pnlPct = (pnlAmt / costValue) * 100;
        
        totalAsset += marketValue;
        totalCost += costValue;

        const pnlClass = getColorClass(pnlAmt);
        const sign = pnlAmt > 0 ? '+' : '';

        // 產生單張股票卡片的 HTML
        html += `
          <div class="stock-card">
            <div class="stock-info">
              <h3>${stock.name} <span class="code">${item.code}</span></h3>
              <div class="stock-meta">
                ${item.shares.toLocaleString()} 股 | 均價 ${item.avgCost.toFixed(2)}
              </div>
            </div>
            <div class="stock-price-col">
              <div class="current-price">${currentPrice.toFixed(2)}</div>
              <div class="pnl ${pnlClass}">
                ${sign}${formatMoney(pnlAmt)} (${sign}${pnlPct.toFixed(2)}%)
              </div>
            </div>
          </div>
        `;
      });

      document.getElementById('stock-list').innerHTML = html || '<div style="text-align:center;color:#91a5be;padding:20px;">尚無持股，請點擊右下角新增</div>';

      // 更新總資產面板
      const totalPnlAmt = totalAsset - totalCost;
      const totalPnlPct = totalCost > 0 ? (totalPnlAmt / totalCost) * 100 : 0;
      const totalClass = getColorClass(totalPnlAmt);
      const totalSign = totalPnlAmt > 0 ? '+' : '';

      document.getElementById('total-asset').innerText = `$${formatMoney(totalAsset)}`;
      document.getElementById('total-pnl-amt').innerText = `未實現損益: ${totalSign}${formatMoney(totalPnlAmt)}`;
      document.getElementById('total-pnl-pct').innerText = `${totalSign}${totalPnlPct.toFixed(2)}%`;
      
      document.getElementById('total-pnl-amt').className = totalClass;
      document.getElementById('total-pnl-pct').className = totalClass;
    }

    // 4. 新增持股邏輯
    function addStock() {
      const code = document.getElementById('input-code').value;
      const shares = parseInt(document.getElementById('input-shares').value);
      const cost = parseFloat(document.getElementById('input-cost').value);

      if (!code || !shares || !cost) {
        alert('請填寫完整資訊！');
        return;
      }

      // 檢查是否已持有，若有則合併計算 (簡單的加權平均)
      const existing = myPortfolio.find(s => s.code === code);
      if (existing) {
        const totalValue = (existing.shares * existing.avgCost) + (shares * cost);
        existing.shares += shares;
        existing.avgCost = totalValue / existing.shares;
      } else {
        myPortfolio.push({ code: code, shares: shares, avgCost: cost });
      }

      // 關閉彈窗、清空表單並重新渲染
      document.getElementById('add-modal').classList.remove('show');
      document.getElementById('input-code').value = '';
      document.getElementById('input-shares').value = '';
      document.getElementById('input-cost').value = '';
      
      renderUI();
    }

    // 初始化啟動
    fetchMarketData();
  </script>
</body>
</html>
