name: Build APK via Asset Replacement

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner zip unzip

      - name: Create Clean APK Base
        run: |
          # 1. 將解包資料夾中的原始 original/AndroidManifest.xml 與 res、assets 組合打包回原本的 zip 結構
          cd 00406A_Tracker_v62R22F
          zip -r ../base.apk assets/
          if [ -d "res" ]; then zip -r ../base.apk res/; fi
          if [ -f "classes.dex" ]; then zip -r ../base.apk classes.dex; fi
          if [ -d "original" ]; then
            cd original
            zip -r ../../base.apk AndroidManifest.xml
            cd ..
          fi
          cd ..

      - name: Zipalign APK
        run: |
          zipalign -v -p 4 base.apk app-aligned.apk

      - name: Generate Keystore & Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign --v1-signing-enabled true --v2-signing-enabled true --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out app-release.apk app-aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
